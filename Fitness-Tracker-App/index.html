<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness Tracker</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🏃 Fitness Tracker</h1><p>Track your daily progress.</p><div class="stats"><div><b id="steps">0</b><small>Steps</small></div><div><b id="workouts">0</b><small>Workout min</small></div><div><b id="calories">0</b><small>Calories</small></div></div><section><input id="sv" type="number" placeholder="Steps"><input id="wv" type="number" placeholder="Workout minutes"><input id="cv" type="number" placeholder="Calories burned"><button onclick="save()">Save Today's Activity</button></section><h2>Weekly Progress</h2><div class="bar"><span id="progress"></span></div><p id="message"></p></main><script src="script.js"></script></body></html>
