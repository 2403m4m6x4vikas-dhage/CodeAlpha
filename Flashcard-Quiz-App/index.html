<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcard Quiz App</title><link rel="stylesheet" href="style.css"></head><body><main><h1>📚 Flashcard Quiz</h1><p class="sub">Study smarter with your own flashcards.</p><section class="card"><div id="question">Question</div><div id="answer" class="answer hidden">Answer</div><button onclick="showAnswer()">Show Answer</button><div class="nav"><button onclick="prev()">← Previous</button><span id="count"></span><button onclick="next()">Next →</button></div></section><section class="add"><h2>Add Flashcard</h2><input id="q" placeholder="Question"><input id="a" placeholder="Answer"><button onclick="addCard()">Add Card</button></section></main><script src="script.js"></script></body></html>
